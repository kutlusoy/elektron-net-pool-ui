<ng-container *ngIf="info$ | async as info">
    <div class="card identity-card" *ngIf="info.name || info.url">
        <span>On-Chain Pool Identity</span>
        <strong>{{info.name || 'Unnamed pool'}}</strong>
        <a *ngIf="info.url" [href]="info.url" target="_blank" rel="noopener noreferrer">{{info.url}}</a>
        <small>Embedded as a dedicated OP_RETURN output in every block this pool finds, alongside the coinbase
            payout to the miner - not a substitute for it.</small>
    </div>
</ng-container>
